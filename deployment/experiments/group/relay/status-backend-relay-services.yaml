---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-init-sa
  namespace: status-bench-group

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: status-bench-group
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: status-bench-group
subjects:
- kind: ServiceAccount
  name: config-init-sa
  namespace: status-bench-group
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: status-backend-relay
  namespace: status-bench-group
spec:
  # Headless service to get per-pod DNS names
  clusterIP: None
  selector:
    app: status-backend-relay