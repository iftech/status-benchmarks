apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: status-service-node
  namespace: status-bench-group
spec:
  replicas: 5
  podManagementPolicy: "Parallel"
  serviceName: status-service-node
  selector:
    matchLabels:
      app: status-service-node
  template:
    metadata:
      labels:
        app: status-service-node
    spec:
      dnsConfig:
        searches:
          - status-service-node.status-bench-group.svc.cluster.local
      volumes:
        - name: enr-data
          emptyDir: {}
        - name: postgres-data
          emptyDir: {}
        - name: postgres-ready
          emptyDir: {}
      initContainers:
        - name: grabenr
          image: soutullostatus/getenr:v1.1.0
          imagePullPolicy: Always
          volumeMounts:
            - name: enr-data
              mountPath: /etc/enr
          command:
            - /app/getenr.sh
          args:
            - "3"
            - "status-service-bootstrap.status-bench-group"
      containers:
        - name: postgres
          image: postgres:15.1-alpine
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-ready
              mountPath: /var/run/postgres-ready
          env:
            - name: POSTGRES_DB
              value: wakumessages
            - name: POSTGRES_USER
              value: wakuuser
            - name: POSTGRES_PASSWORD
              value: wakupassword
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  if pg_isready -h 127.0.0.1 -p 5432 -U wakuuser -d wakumessages; then
                    touch /var/run/postgres-ready/ready
                  else
                    rm -f /var/run/postgres-ready/ready
                    exit 1
                  fi
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 5
        - name: waku
          image: albertodst/nwaku:v0.39.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8645
            - containerPort: 8008
          volumeMounts:
            - name: enr-data
              mountPath: /etc/enr
            - name: postgres-ready
              mountPath: /var/run/postgres-ready
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -sf http://127.0.0.1:8008/health | grep -q 'OK'"
            successThreshold: 5
            initialDelaySeconds: 5
            periodSeconds: 1
            failureThreshold: 2
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "150m"
            limits:
              memory: "600Mi"
              cpu: "400m"
          env:
            - name: IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POSTGRES_URL
              value: "postgres://wakuuser:wakupassword@127.0.0.1:5432/wakumessages"
          command:
            - sh
            - -c
            - |
              . /etc/enr/ENR
              echo ENRs are $ENR1 $ENR2 $ENR3
              until [ -f /var/run/postgres-ready/ready ]; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

              /usr/bin/logosdeliverynode --relay=true --peer-exchange=true --lightpush=false --nat=extip:$IP --filter=false --store=true --store-message-db-url=${POSTGRES_URL} --max-connections=800 --rest=true --rest-admin=true --rest-address=0.0.0.0 --discv5-discovery=true --discv5-enr-auto-update=True --log-level=INFO --metrics-server=True --metrics-server-address=0.0.0.0 --discv5-bootstrap-node=$ENR1 --discv5-bootstrap-node=$ENR2 --discv5-bootstrap-node=$ENR3 --cluster-id=16 --shard=32 --shard=64
